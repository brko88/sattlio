# Produkcijski config (montira se preko docker-compose.prod.yml, ne ide u
# image). Isti cache/security header logika kao dev nginx.conf, plus
# HTTPS terminacija i redirect sa 80 na 443.
map $uri $cache_control {
    ~^/assets/     "public, max-age=31536000, immutable";
    ~^/api/media/  "public, max-age=31536000, immutable";
    default        "no-cache";
}

server {
    listen 80;
    server_name sattlio.com www.sattlio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www -> goli domen (kanonski host) - isti cert (SAN) pokriva oba
server {
    listen 443 ssl;
    server_name www.sattlio.com;

    ssl_certificate /etc/letsencrypt/live/sattlio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sattlio.com/privkey.pem;

    return 301 https://sattlio.com$request_uri;
}

server {
    listen 443 ssl;
    server_name sattlio.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/sattlio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sattlio.com/privkey.pem;

    client_max_body_size 8m;

    add_header Cache-Control $cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
