# Log rotation: bez ovoga docker logs raste neograniceno i vremenom napuni
# disk. 50MB x 10 fajlova = do ~500MB istorije po kontejneru (par sedmica),
# dovoljno da se unazad istrazi incident, a ograniceno.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

services:
  db:
    image: postgres:16
    logging: *default-logging
    # max_connections=200: aplikacija smije 160 (4 uvicorn workera x pool 20+20,
    # vidi app/core/database.py), ostatak je rezerva za migracije/psql/healthcheck.
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: smartbooking
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/smartbooking
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      COOKIE_SECURE: ${COOKIE_SECURE}
    volumes:
      - ./alembic:/app/alembic
      - ./app:/app/app
      - media_data:/app/media
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  media_data:
