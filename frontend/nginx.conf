# Cache politika po tipu putanje. Kljucno: index.html (i sw.js) MORAJU biti
# no-cache - bez toga browser drzi stari index.html po heuristici (nema
# eksplicitnog headera => browser sam odlucuje koliko je "svjez") i korisnik
# vidi staru verziju aplikacije dok ne uradi hard refresh. Hashovani /assets/
# fajlovi su suprotno: URL im se mijenja sa sadrzajem, pa smiju biti kesirani
# zauvijek. no-cache NE znaci "bez kesiranja" nego "provjeri prije upotrebe"
# (ETag/304 - jeftino, ~1KB po navigaciji).
map $uri $cache_control {
    ~^/assets/     "public, max-age=31536000, immutable";
    ~^/api/media/  "public, max-age=31536000, immutable";
    default        "no-cache";
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Default (1m) je manji od najveceg dozvoljenog uploada (cover/logo/screenshot,
    # 5MB - vidi app/api/routes/tenants.py, support.py). Bez ovoga nginx odbija
    # fajl PRIJE nego stigne do backenda, sa golim HTML 413 (ne JSON), pa frontend
    # ne moze pokazati razlog - samo generican "Greska prilikom uploada".
    # 8m ostavlja rezervu iznad 5MB limita za multipart overhead.
    client_max_body_size 8m;

    add_header Cache-Control $cache_control always;

    # Ignorisan preko http-a (spec), primjenjuje se tek kad se stvarno servira
    # preko https-a (npr. iza reverse proxy-a koji terminira TLS).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}