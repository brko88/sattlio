services:
  backend:
    volumes:
      - ./infra/network_usage.csv:/app/infra/network_usage.csv:ro

  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot-webroot:/var/www/certbot
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
